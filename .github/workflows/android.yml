name: Breda Beats tests and APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug --stacktrace
      - name: Sign and verify evaluation APK
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=breda_dev,C=BR" -keyalg RSA -keysize 2048 -validity 365
          fi
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in androidApp/build/outputs/apk/debug/*.apk; do
            "$signer" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$apk"
            "$signer" verify --verbose "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: breda-beats-android-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breda-beats-check-reports
          path: |
            core/build/reports/tests/
            androidApp/build/reports/tests/
            androidApp/build/reports/lint-results-debug.*
